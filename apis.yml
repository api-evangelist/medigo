name: Medigo
description: >-
  Medigo (MEDIGO GmbH) is a Berlin-based health-tech company, founded in 2013,
  that enables global access to quality healthcare as a third party
  administrator (TPA). It helps insurers and organisations navigate healthcare
  worldwide with a curated provider network spanning 100+ countries, tech-driven
  cost containment, claims handling, medical concierge, and second medical
  opinions. Medigo exposes a partner REST API (MEDIGO API V2) that lets insurers
  and integrators manage members, insurance policies, terms and insured members,
  submit and track TPA claims, request and track second medical opinions, upload
  medical attachments, search procedures, and receive event webhooks. Backed by
  Accel and Atlantic Labs.
